name: Build iOS / macOS Shared Framework

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apple:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS Simulator Framework
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-framework
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
